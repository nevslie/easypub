# Prüft nach jedem Merge (= Push) auf development, ob das Projekt baut
# und die Unit-Tests durchlaufen. Es wird nichts veröffentlicht.
name: Build (development)

on:
  push:
    branches: [development]
  workflow_dispatch: # erlaubt zusätzlich einen manuellen Start im Actions-Tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v5

      - name: JDK 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Richtet Gradle ein und cached Abhängigkeiten zwischen den Läufen.
      # Das Android SDK ist auf ubuntu-latest bereits vorinstalliert.
      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v5

      - name: Unit-Tests ausführen
        run: ./gradlew testDebugUnitTest

      - name: Debug-APK bauen
        run: ./gradlew assembleDebug

      # Die APK bleibt einige Tage im Workflow-Lauf zum Herunterladen liegen.
      - name: Debug-APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: easypub-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
