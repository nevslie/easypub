# Ein Workflow für beide Branches, aufgeteilt in zwei Jobs:
#
#   test ──────────┐
#                  ├──needs──▶ release
#   check-version ─┘
#
# test           läuft bei jedem Push auf development und main:
#                Unit-Tests, Debug-APK bauen und als Workflow-Artefakt hochladen.
# check-version  läuft nur auf main: liest versionName aus und prüft,
#                ob es dafür schon einen Release gibt.
# release        läuft nur, wenn test erfolgreich war UND die Version neu ist:
#                signierte Release-APK bauen und als GitHub Release veröffentlichen.
#
# Benötigte Repository-Secrets für den Release (Settings → Secrets and variables → Actions):
#   SIGNING_KEYSTORE_BASE64    Keystore-Datei (.jks), base64-kodiert
#   SIGNING_KEYSTORE_PASSWORD  Passwort des Keystores
#   SIGNING_KEY_ALIAS          Alias des Schlüssels im Keystore
#   SIGNING_KEY_PASSWORD       Passwort des Schlüssels
#
# Der Release-Name kommt aus versionName in app/build.gradle.kts (z. B. v0.1.0).
# Gibt es diesen Release schon, wird der Release übersprungen (kein Fehler).
# Für einen neuen Release also versionName (und versionCode) erhöhen.
name: CI

on:
  push:
    branches: [development, main]
  workflow_dispatch: # erlaubt zusätzlich einen manuellen Start im Actions-Tab

# Standard für alle Jobs: nur lesen. Der Release-Job bekommt unten mehr Rechte.
permissions:
  contents: read

jobs:
  test:
    name: Tests und Debug-Build
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v5

      - name: JDK 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Richtet Gradle ein und cached Abhängigkeiten zwischen den Läufen.
      # Das Android SDK ist auf ubuntu-latest bereits vorinstalliert.
      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v5

      - name: Unit-Tests ausführen
        run: ./gradlew testDebugUnitTest

      - name: Debug-APK bauen
        run: ./gradlew assembleDebug

      # Die APK bleibt einige Tage im Workflow-Lauf zum Herunterladen liegen.
      - name: Debug-APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: easypub-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  check-version:
    name: Version prüfen
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Job-Outputs: Werte, die andere Jobs über needs.check-version.outputs.<name> lesen können.
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_new: ${{ steps.exists.outputs.is_new }}

    steps:
      - name: Code auschecken
        uses: actions/checkout@v5

      - name: Version auslesen
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then
            echo "::error::versionName in app/build.gradle.kts nicht gefunden"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Prüfen, ob es den Release schon gibt
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release v${{ steps.version.outputs.version }} gibt es schon. Kein neuer Release. Für einen Release versionName erhöhen."
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Signierter Release
    # Verbindung der Jobs: release wartet auf beide Jobs und nutzt deren Ergebnisse.
    needs: [test, check-version]
    # Nur wenn die Version neu ist. check-version läuft nur auf main,
    # daher wird release auf development automatisch übersprungen.
    if: needs.check-version.outputs.is_new == 'true'
    runs-on: ubuntu-latest

    # Jeder Job läuft auf einem eigenen, frischen Runner. Deshalb werden
    # Checkout, JDK und Gradle hier erneut eingerichtet.
    permissions:
      contents: write # nötig, um Tags und Releases anzulegen

    env:
      VERSION: ${{ needs.check-version.outputs.version }}

    steps:
      - name: Code auschecken
        uses: actions/checkout@v5

      - name: JDK 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v5

      - name: Keystore aus Secret wiederherstellen
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 fehlt. Siehe Kommentar oben in dieser Datei."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Signierte Release-APK bauen
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk "easypub-v$VERSION.apk"

      - name: GitHub Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "easypub-v$VERSION.apk" \
            --target "${{ github.sha }}" \
            --title "EasyPub v$VERSION" \
            --generate-notes

      - name: Keystore löschen
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
